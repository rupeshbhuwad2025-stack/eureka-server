spring.application.name=eureka-server
# The conventional default port for Eureka Server
server.port=8861

eureka.client.service-url.defaultZone=http://localhost:8861/eureka/

# Prevent the server from registering with itself
eureka.client.register-with-eureka=false

# Prevent the server from pulling the registry info locally
eureka.client.fetch-registry=false
